services:
  # 1. 독립 Gateway Nginx (단일 진입점: 라우팅, 프록시, Blue/Green 스위칭, SSL Termination)
  gateway:
    image: nginx:alpine
    container_name: infra-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/backend-upstream.conf:/etc/nginx/conf.d/backend-upstream.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend

  # 2. Frontend (React SPA 정적 파일 서빙)
  frontend:
    image: ghcr.io/black4758/inflatest2026/frontend:latest
    container_name: infra-frontend
    restart: always
    expose:
      - "80"

  # 3-1. Backend Blue (Spring Boot 4.x / Java 21)
  backend-blue:
    image: ghcr.io/black4758/inflatest2026/backend:latest
    container_name: infra-backend-blue
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      - mysql

  # 3-2. Backend Green (Spring Boot 4.x / Java 21)
  backend-green:
    image: ghcr.io/black4758/inflatest2026/backend:latest
    container_name: infra-backend-green
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      - mysql

  # 4. Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: infra-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ${MYSQL_USER} -p${MYSQL_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
