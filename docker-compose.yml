services:
  # 1. 독립 Gateway Nginx (단일 진입점: 라우팅, 프록시, Blue/Green 스위칭, SSL Termination)
  gateway:
    image: nginx:alpine
    container_name: infra-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/backend-upstream.conf:/etc/nginx/conf.d/backend-upstream.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - grafana

  # 2. Frontend (React SPA 정적 파일 서빙)
  frontend:
    image: ghcr.io/black4758/inflatest2026/frontend:latest
    container_name: infra-frontend
    restart: always
    expose:
      - "80"

  # 3-1. Backend Blue (Spring Boot 4.x / Java 21)
  backend-blue:
    image: ghcr.io/black4758/inflatest2026/backend:latest
    container_name: infra-backend-blue
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      - mysql

  # 3-2. Backend Green (Spring Boot 4.x / Java 21)
  backend-green:
    image: ghcr.io/black4758/inflatest2026/backend:latest
    container_name: infra-backend-green
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      - mysql

  # 4. Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: infra-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ${MYSQL_USER} -p${MYSQL_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # 5. Prometheus (메트릭 수집기 - 외부 포트 차단, 내부망 전용)
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'

  # 6. Loki (로그 저장소 - 외부 포트 차단, 내부망 전용)
  loki:
    image: grafana/loki:2.9.10
    container_name: infra-loki
    user: "0"
    restart: always
    expose:
      - "3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # 7. Promtail (도커 컨테이너 실시간 로그 수집기 -> Loki로 전송)
  promtail:
    image: grafana/promtail:2.9.10
    container_name: infra-promtail
    user: "0"
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # 8. Grafana (모니터링 시각화 대시보드 - 외부 포트 차단, Nginx /grafana/ 경유 접속)
  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    restart: always
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin1234!}
      GF_SERVER_ROOT_URL: "https://infla.koreacentral.cloudapp.azure.com/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      TZ: Asia/Seoul
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  mysql_data:
  prometheus_data:
  loki_data:
  grafana_data:
