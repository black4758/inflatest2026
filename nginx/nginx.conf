events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream response time (great for infra testing)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Upstream definition for Backend (Supports zero-downtime Blue/Green switching)
    upstream backend_servers {
        include /etc/nginx/conf.d/backend-upstream.conf;
    }

    # Upstream definition for Frontend
    upstream frontend_servers {
        server frontend:80;
    }

    # Upstream definition for Grafana (내부 3000번 포트 연결)
    upstream grafana_servers {
        server grafana:3000;
    }

    # 1. HTTP (80) -> HTTPS (443) 자동 리다이렉트 (내부 Prometheus 메트릭 수집 경로는 허용)
    server {
        listen 80;
        server_name infla.koreacentral.cloudapp.azure.com localhost;

        location /actuator/prometheus {
            proxy_pass http://backend_servers/actuator/prometheus;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS (443) SSL Termination 및 리버스 프록시
    server {
        listen 443 ssl;
        server_name infla.koreacentral.cloudapp.azure.com localhost;

        ssl_certificate /etc/letsencrypt/live/infla.koreacentral.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/infla.koreacentral.cloudapp.azure.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Custom header to prove Nginx gateway proxying
        add_header X-Gateway-Server "Nginx-Reverse-Proxy" always;

        # 1. Backend REST API routing
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 2. Spring Boot Actuator routing
        location /actuator/ {
            proxy_pass http://backend_servers/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 3. Grafana Monitoring Dashboard routing (내부 3000 포트 프록시)
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Frontend SPA static file routing
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
