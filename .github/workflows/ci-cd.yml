name: CI/CD Optimized Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:

# GHCR(컨테이너 레지스트리) 이미지 발행 권한 부여
permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. 변경된 디렉터리 감지 (Path Filter)
  # ========================================================
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'nginx/**'
              - '.github/**'

  # ========================================================
  # 2. 백엔드 코드 검증 (PR / Push 시 실행)
  # ========================================================
  backend-ci:
    name: Backend Test (Java 21 / Spring Boot)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        working-directory: backend
        run: ./gradlew check

  # ========================================================
  # 3. 프론트엔드 코드 검증 (PR / Push 시 실행)
  # ========================================================
  frontend-ci:
    name: Frontend Build Check (React 19 / Vite)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ========================================================
  # 4. CI 러너에서 이미지 빌드 및 GHCR 푸시
  # ========================================================
  build-and-push:
    name: Build & Push Images to GHCR
    needs: [detect-changes, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
      (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') &&
      !(needs.backend-ci.result == 'failure' || needs.frontend-ci.result == 'failure') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infra == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 백엔드 도커 이미지 빌드 & 푸시
      - name: Set up JDK 21 (Backend Packaging)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend JAR
        run: |
          chmod +x backend/gradlew
          cd backend && ./gradlew bootJar -x test

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # 프론트엔드 도커 이미지 빌드 & 푸시
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # ========================================================
  # 5. 서버 원격 배포 (Public 이미지 초고속 Pull & 갱신)
  # ========================================================
  deploy:
    name: Deploy to Server via SSH
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infra == 'true')
    steps:
      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_USER }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ [안내] SSH Secrets가 설정되지 않아 배포를 건너뜁니다."
          fi

      - name: Deploy to Remote Server via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [Deploy] Starting deployment on production server..."

            # 0. Docker 소켓 권한 부여
            sudo chmod 666 /var/run/docker.sock || true

            # 1. 디렉터리 확인
            if [ ! -d "$HOME/inflatest2026" ]; then
              git clone https://github.com/black4758/inflatest2026.git "$HOME/inflatest2026"
            fi

            cd "$HOME/inflatest2026"

            # 2. 최신 코드 동기화
            git fetch origin main
            git reset --hard origin/main

            # 3. 최신 이미지 당겨오기 (Public 패키지이므로 로그인 불필요)
            echo "📥 Pulling latest pre-built images from GHCR..."
            docker compose pull || sudo docker compose pull

            # 4. 컨테이너 갱신 실행
            echo "🐳 Restarting containers..."
            docker compose up -d --remove-orphans || sudo docker compose up -d --remove-orphans

            # 5. 미사용 찌꺼기 이미지 정리
            docker image prune -f || sudo docker image prune -f

            echo "✅ Deployment finished successfully without server overhead!"