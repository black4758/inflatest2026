name: CI/CD Optimized Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:

# GHCR(컨테이너 레지스트리) 이미지 발행 권한 부여
permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. 변경된 디렉터리 감지 (Path Filter)
  # ========================================================
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'nginx/**'
              - '.github/**'

  # ========================================================
  # 2. 백엔드 코드 검증 (PR / Push 시 실행)
  # ========================================================
  backend-ci:
    name: Backend Test (Java 21 / Spring Boot)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        working-directory: backend
        run: ./gradlew check

  # ========================================================
  # 3. 프론트엔드 코드 검증 (PR / Push 시 실행)
  # ========================================================
  frontend-ci:
    name: Frontend Build Check (React 19 / Vite)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ========================================================
  # 4. CI 러너에서 이미지 빌드 및 GHCR 푸시
  # ========================================================
  build-and-push:
    name: Build & Push Images to GHCR
    needs: [detect-changes, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
      (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') &&
      !(needs.backend-ci.result == 'failure' || needs.frontend-ci.result == 'failure') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infra == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 백엔드 도커 이미지 빌드 & 푸시
      - name: Set up JDK 21 (Backend Packaging)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend JAR
        run: |
          chmod +x backend/gradlew
          cd backend && ./gradlew bootJar -x test

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # 프론트엔드 도커 이미지 빌드 & 푸시
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # ========================================================
  # 5. 서버 원격 Blue/Green 무중단 배포
  # ========================================================
  deploy:
    name: Blue/Green Zero-Downtime Deploy via SSH
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infra == 'true')
    steps:
      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_USER }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ [안내] SSH Secrets가 설정되지 않아 배포를 건너뜁니다."
          fi

      - name: Deploy to Remote Server via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "=================================================="
            echo "🚀 [GitHub Actions] Blue/Green Zero-Downtime Deploy"
            echo "=================================================="

            # 1. 최신 코드 동기화
            cd "$HOME/inflatest2026"
            git fetch origin main
            git reset --hard origin/main

            # 2. Docker 권한 확인 및 이전 단일 컨테이너 정리
            sudo chmod 666 /var/run/docker.sock 2>/dev/null || true
            docker rm -f infra-backend 2>/dev/null || sudo docker rm -f infra-backend 2>/dev/null || true

            # 3. 최신 이미지 당겨오기 & 기본 인프라 가동
            echo "📥 Pulling latest images from GHCR..."
            docker compose pull || sudo docker compose pull
            echo "🚀 Ensuring MySQL and Frontend are running..."
            docker compose up -d mysql frontend || sudo docker compose up -d mysql frontend

            # 4. 활성 컨테이너 감지 및 배포 대상 결정 (Blue vs Green)
            IS_BLUE=$(docker ps -q -f name=infra-backend-blue || sudo docker ps -q -f name=infra-backend-blue || true)
            IS_GREEN=$(docker ps -q -f name=infra-backend-green || sudo docker ps -q -f name=infra-backend-green || true)

            UPSTREAM_CONF="./nginx/backend-upstream.conf"

            if [ -n "$IS_GREEN" ] && [ -z "$IS_BLUE" ]; then
              TARGET_SERVICE="backend-blue"
              OLD_SERVICE="backend-green"
            elif [ -n "$IS_BLUE" ] && [ -z "$IS_GREEN" ]; then
              TARGET_SERVICE="backend-green"
              OLD_SERVICE="backend-blue"
            else
              TARGET_SERVICE="backend-blue"
              OLD_SERVICE=""
            fi

            echo "🎯 배포 대상 (새 버전): $TARGET_SERVICE"
            if [ -n "$OLD_SERVICE" ]; then
              echo "⏸️ 현재 서비스 중: $OLD_SERVICE"
            else
              echo "🌱 최초 배포 상태"
            fi

            # 5. 새 버전 컨테이너 기동
            echo "🐳 Starting $TARGET_SERVICE..."
            docker compose up -d $TARGET_SERVICE || sudo docker compose up -d $TARGET_SERVICE

            # 6. Actuator 헬스체크 대기 (스프링 부트가 완전히 뜰 때까지)
            echo "⏳ Waiting for $TARGET_SERVICE (/actuator/health) to be UP..."
            MAX_RETRIES=35
            RETRY_COUNT=0
            HEALTHY=false

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]
            do
              RAW_RES=$(docker exec infra-$TARGET_SERVICE curl -s http://localhost:8080/actuator/health 2>/dev/null || sudo docker exec infra-$TARGET_SERVICE curl -s http://localhost:8080/actuator/health 2>/dev/null || true)
              if echo "$RAW_RES" | grep -q '"status":[ ]*"UP"'; then
                HEALTHY=true
                echo "💚 $TARGET_SERVICE is healthy and ready to receive traffic!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "Checking $TARGET_SERVICE health ($RETRY_COUNT/$MAX_RETRIES)... Response: ${RAW_RES:-'(waiting for JVM...)'}"
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ [배포 실패] $TARGET_SERVICE 헬스체크 실패! 최근 로그:"
              docker logs --tail 30 infra-$TARGET_SERVICE 2>/dev/null || sudo docker logs --tail 30 infra-$TARGET_SERVICE 2>/dev/null || true
              if [ -n "$OLD_SERVICE" ]; then
                echo "기존 서비스($OLD_SERVICE)를 유지하고 새 컨테이너($TARGET_SERVICE)를 중지합니다."
                docker compose stop $TARGET_SERVICE 2>/dev/null || sudo docker compose stop $TARGET_SERVICE 2>/dev/null || true
              fi
              exit 1
            fi

            # 7. Nginx 트래픽 스위칭 (0.01초 무중단 전환)
            echo "🔄 Updating Nginx upstream to $TARGET_SERVICE..."
            echo "server $TARGET_SERVICE:8080;" > "$UPSTREAM_CONF"

            # Gateway 기동 (처음이면 start, 이미 돌고 있으면 reload)
            docker compose up -d gateway || sudo docker compose up -d gateway
            docker exec infra-gateway nginx -s reload 2>/dev/null || sudo docker exec infra-gateway nginx -s reload 2>/dev/null || true
            echo "✨ Traffic successfully routed to $TARGET_SERVICE!"

            # 8. 이전 버전 컨테이너 안전 종료
            if [ -n "$OLD_SERVICE" ]; then
              echo "🛑 Stopping and removing previous container: $OLD_SERVICE..."
              docker compose stop $OLD_SERVICE 2>/dev/null || sudo docker compose stop $OLD_SERVICE 2>/dev/null || true
              docker compose rm -f $OLD_SERVICE 2>/dev/null || sudo docker compose rm -f $OLD_SERVICE 2>/dev/null || true
            fi

            # 9. 찌꺼기 이미지 정리
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f 2>/dev/null || sudo docker image prune -f 2>/dev/null || true

            echo "=================================================="
            echo "🎉 [Success] Blue/Green Zero-Downtime Deployment Finished!"
            echo "=================================================="