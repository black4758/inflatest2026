name: CI/CD Optimized Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. 어떤 영역의 코드가 변경되었는지 감지 (Path Filter)
  # ========================================================
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'nginx/**'

  # ========================================================
  # 2. 백엔드 코드 변경 시에만 실행되는 빌드 & 테스트
  # ========================================================
  backend-ci:
    name: Backend Test (Java 21 / Spring Boot)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        working-directory: backend
        run: ./gradlew check

  # ========================================================
  # 3. 프론트엔드 코드 변경 시에만 실행되는 빌드
  # ========================================================
  frontend-ci:
    name: Frontend Build (React 19 / Vite)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ========================================================
  # 4. 서버 원격 자동 배포 (main 브랜치 푸시 시)
  # ========================================================
  deploy:
    name: Deploy to Server via SSH
    needs: [detect-changes, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
      (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') &&
      !(needs.backend-ci.result == 'failure' || needs.frontend-ci.result == 'failure') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.infra == 'true')

    steps:
      - name: Check if Deployment Secrets are configured
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_USER }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ [안내] SERVER_HOST / USER / SSH_KEY Secrets가 아직 등록되지 않아 SSH 배포를 건너뜁니다."
          fi

      - name: Deploy to Remote Server via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Checking server environment..."

            # 1. Docker 설치 여부 확인 및 자동 설치
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker and Docker Compose..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io docker-compose-v2
              sudo usermod -aG docker $USER || true
            fi

            # 2. 저장소 디렉토리 없으면 자동 클론
            if [ ! -d "$HOME/inflatest2026" ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/black4758/inflatest2026.git "$HOME/inflatest2026"
            fi

            cd "$HOME/inflatest2026"

            # 3. 최신 코드 풀
            echo "🔄 Pulling latest main branch..."
            git pull origin main

            # 4. .env 파일이 없으면 .env.example 기반으로 자동 생성
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
            fi

            # 5. 도커 컴포즈 빌드 및 실행
            echo "🐳 Starting containers via Docker Compose..."
            sudo docker compose up -d --build

            # 6. 실행 상태 출력
            sudo docker compose ps
            echo "✅ Deployment Finished Successfully!"

